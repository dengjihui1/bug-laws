[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bug-laws"
version = "0.1.0"
description = "Recover evidence-linked candidate engineering laws from bug-fix history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zihui Deng" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
buglaws = "buglaws.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["buglaws"]

